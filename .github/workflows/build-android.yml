name: Build AliasNull Android

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build ARM64 Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ---- Part 27-B: Rust Android ARM64 toolchain ----
      # The repository rust-toolchain.toml pins the channel and the
      # aarch64-linux-android target, so a clean runner reproduces the toolchain
      # with no machine-local Rust setup. cargo-ndk (installed from source via
      # crates.io, not an opaque prebuilt binary) drives the cross-compile that
      # compileAnShellCoreRust invokes during the Gradle build.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Part 27-C: host-side Rust lexer tests. cargo test compiles for the host
      # target (the Android ARM64 cross-build below remains separate and is
      # exercised through the Gradle build). A failing lexer test fails CI.
      - name: Run AN Shell core Rust tests (host)
        run: cargo test --manifest-path rust/aliasnull_an_shell_core/Cargo.toml

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version
          cmake --version || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build ARM64 Debug APK
        run: |
          # cargo-ndk (used by compileAnShellCoreRust) needs the NDK. AGP
          # resolves the same NDK for the existing C++ CMake build; exporting it
          # here keeps one NDK version for both native consumers.
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify Rust artifact is packaged in the APK
        run: |
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n1)"
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          echo "Checking $APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libaliasnull_an_shell_core\.so' \
            || { echo "FAIL: libaliasnull_an_shell_core.so (Rust) missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libaliasnull_runtime\.so' \
            && echo "OK: existing native runtime still packaged" \
            || echo "WARN: libaliasnull_runtime.so not found (native disabled?)"

      # ---- Part 27-S2: the APK must ship the base-userspace asset bundle ----
      # The base-userspace files are APK assets under assets/userspace/base/. The
      # executable must be present in the built APK, must still be the 64-bit
      # AArch64 ELF, and its bytes inside the APK must hash to the same
      # BASE_EXECUTABLE_SHA256 constant. CI fails if the executable is missing
      # from the APK or its bytes inside the APK differ from the manifest.
      - name: Verify the base userspace asset bundle is packaged in the APK
        run: |
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n1)"
          test -n "$APK" || { echo "FAIL: No APK produced"; exit 1; }
          MANIFEST="app/src/main/java/app/aliasnull/shell/bootstrap/BaseUserspaceArtifact.kt"
          CONST="$(grep -A1 'BASE_EXECUTABLE_SHA256' "$MANIFEST" | grep -oE '[0-9a-f]{64}' | head -n1)"
          test -n "$CONST" || { echo "FAIL: BASE_EXECUTABLE_SHA256 constant not found in $MANIFEST"; exit 1; }
          for entry in aliasnull_base_probe VERSION ARCH DESCRIPTION PROVENANCE.txt LICENSE.txt; do
            unzip -l "$APK" | grep -q "assets/userspace/base/$entry" \
              || { echo "FAIL: assets/userspace/base/$entry missing from APK"; exit 1; }
          done
          unzip -l "$APK" | grep 'assets/userspace/base/aliasnull_base_probe' || { echo "FAIL: base executable missing"; exit 1; }
          TMP="$(mktemp -d)"
          unzip -p "$APK" assets/userspace/base/aliasnull_base_probe > "$TMP/aliasnull_base_probe"
          IN_APK_SHA="$(sha256sum "$TMP/aliasnull_base_probe" | awk '{print $1}')"
          echo "asset in APK:  $IN_APK_SHA"
          echo "manifest const: $CONST"
          test "$IN_APK_SHA" = "$CONST" \
            || { echo "FAIL: the base executable bytes inside the APK do not match the manifest constant (Part 27-S2)"; exit 1; }
          file "$TMP/aliasnull_base_probe"
          file "$TMP/aliasnull_base_probe" | grep -q "ELF 64-bit" || { echo "FAIL: in-APK asset is not a 64-bit ELF"; exit 1; }
          file "$TMP/aliasnull_base_probe" | grep -q "ARM aarch64" || { echo "FAIL: in-APK asset is not ARM AArch64"; exit 1; }
          rm -rf "$TMP"
          echo "OK: base-userspace asset bundle (including the executable) is packaged in the APK and matches the manifest constant"

      # ---- Part 27-S1/S2: CI arm64 base-userspace artifact pipeline ----
      # Builds the AliasNull base-userspace probe executable (a real AArch64 ELF
      # PIE) standalone from the same NDK 28.2 / CMake 3.22.1 toolchain the APK
      # uses, validates it, hashes it, and uploads it as a proof artifact. The
      # SAME binary is the committed asset app/src/main/assets/userspace/base/
      # aliasnull_base_probe (Part 27-S2): the step below that recomputes its
      # SHA-256 must equal the committed asset AND the BASE_EXECUTABLE_SHA256
      # Kotlin manifest constant, so a rebuild of the current source tree is
      # proven byte-identical to what ships. That equality is verified by the
      # "reproduces the committed asset" step below and CI fails on any mismatch.
      - name: Build AliasNull base userspace probe executable (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          export PATH="${ANDROID_SDK_ROOT}/cmake/3.22.1/bin:${PATH}"
          cmake -S app/src/main/cpp \
                -B build/userspace-probe \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26
          cmake --build build/userspace-probe --target aliasnull_base_probe

      - name: Validate base userspace probe ELF / architecture
        run: |
          BIN="build/userspace-probe/aliasnull_base_probe"
          test -f "$BIN" || { echo "FAIL: executable was not produced"; exit 1; }
          test -s "$BIN" || { echo "FAIL: executable is empty"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ELF 64-bit" || { echo "FAIL: not a 64-bit ELF"; exit 1; }
          file "$BIN" | grep -q "ARM aarch64" || { echo "FAIL: not ARM AArch64"; exit 1; }
          file "$BIN" | grep -qE "pie executable|shared object" || { echo "FAIL: not an executable image"; exit 1; }
          readelf -h "$BIN" | grep -q "Machine:.*AArch64" || { echo "FAIL: readelf machine is not AArch64"; exit 1; }
          readelf -h "$BIN" | grep -q "Class:.*ELF64" || { echo "FAIL: readelf class is not ELF64"; exit 1; }
          echo "OK: validated as a 64-bit AArch64 ELF executable"

      - name: Compute SHA-256 of the base userspace probe
        run: |
          BIN="build/userspace-probe/aliasnull_base_probe"
          sha256sum "$BIN" | tee build/userspace-probe/aliasnull_base_probe.sha256
          test -s build/userspace-probe/aliasnull_base_probe.sha256 || { echo "FAIL: SHA-256 not generated"; exit 1; }

      # ---- Part 27-S2: the committed asset must be the reproducible binary ----
      # The standalone build above re-derives the probe from the CURRENT source
      # tree. CI must prove that the committed APK asset
      # (app/src/main/assets/userspace/base/aliasnull_base_probe) is exactly what
      # a fresh build produces, and that the BASE_EXECUTABLE_SHA256 manifest
      # constant is that same hash. Any mismatch (asset drifted from source, or
      # the manifest constant no longer describes the shipped binary) fails CI.
      - name: Verify the committed asset reproduces the fresh build and matches the manifest constant
        run: |
          FRESH="build/userspace-probe/aliasnull_base_probe"
          COMMITTED="app/src/main/assets/userspace/base/aliasnull_base_probe"
          MANIFEST="app/src/main/java/app/aliasnull/shell/bootstrap/BaseUserspaceArtifact.kt"
          CONST="$(grep -A1 'BASE_EXECUTABLE_SHA256' "$MANIFEST" | grep -oE '[0-9a-f]{64}' | head -n1)"
          test -n "$CONST" || { echo "FAIL: BASE_EXECUTABLE_SHA256 constant not found in $MANIFEST"; exit 1; }
          test -f "$COMMITTED" || { echo "FAIL: committed asset $COMMITTED is missing"; exit 1; }
          FRESH_SHA="$(sha256sum "$FRESH" | awk '{print $1}')"
          COMMITTED_SHA="$(sha256sum "$COMMITTED" | awk '{print $1}')"
          echo "fresh build:     $FRESH_SHA"
          echo "committed asset: $COMMITTED_SHA"
          echo "manifest const:  $CONST"
          test "$FRESH_SHA" = "$COMMITTED_SHA" \
            || { echo "FAIL: a fresh build of the probe does not byte-match the committed asset (Part 27-S2)"; exit 1; }
          test "$FRESH_SHA" = "$CONST" \
            || { echo "FAIL: the probe hash does not match the BASE_EXECUTABLE_SHA256 manifest constant (Part 27-S2)"; exit 1; }
          file "$COMMITTED"
          file "$COMMITTED" | grep -q "ELF 64-bit" || { echo "FAIL: committed asset is not a 64-bit ELF"; exit 1; }
          file "$COMMITTED" | grep -q "ARM aarch64" || { echo "FAIL: committed asset is not ARM AArch64"; exit 1; }
          readelf -h "$COMMITTED" | grep -q "Machine:.*AArch64" || { echo "FAIL: committed asset machine is not AArch64"; exit 1; }
          # Part 27-S2-PERM-FIX: a static assertion that the committed executable
          # is INTENDED to be executable (it carries an exec bit in its stored
          # mode). This proves packaging intent only - it does NOT prove that the
          # Android/SELinux policy on a real device permits execve() of the file,
          # which only the on-device Base Executable diagnostic can establish.
          test -x "$COMMITTED" || { echo "FAIL: committed asset $COMMITTED is not stored as executable"; exit 1; }
          test -x "$FRESH" || { echo "FAIL: fresh build $FRESH is not executable"; exit 1; }
          echo "OK: committed base-userspace executable reproduces the fresh build and matches the manifest constant"
          echo "note: stored-exec-bit asserted for packaging intent; Android runtime exec is verified only on a device"

      - name: Generate provenance metadata
        run: |
          BIN="build/userspace-probe/aliasnull_base_probe"
          SHA="$(awk '{print $1}' build/userspace-probe/aliasnull_base_probe.sha256)"
          SIZE="$(wc -c < "$BIN")"
          PROV="build/userspace-probe/aliasnull_base_probe.provenance.txt"
          {
            echo "component: aliasnull_base_probe"
            echo "executable_version: 1"
            echo "source_repository: AliasNull (aliasnull/AliasNullTerminal)"
            echo "source_revision: ${GITHUB_SHA}"
            echo "source_file: app/src/main/cpp/aliasnull_base_probe.cpp"
            echo "build_system: CMake + Android NDK android.toolchain.cmake"
            echo "toolchain_ndk: 28.2.13676358"
            echo "target_abi: arm64-v8a"
            echo "target_arch: AArch64 (64-bit)"
            echo "android_platform: 26"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "filename: aliasnull_base_probe"
            echo "file_size_bytes: ${SIZE}"
            echo "sha256: ${SHA}"
            echo "license: AliasNull project source terms (see repository LICENSE)"
          } > "$PROV"
          cat "$PROV"
          test -s "$PROV" || { echo "FAIL: provenance metadata not generated"; exit 1; }

      - name: Upload base userspace probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliasnull-base-userspace-arm64
          path: |
            build/userspace-probe/aliasnull_base_probe
            build/userspace-probe/aliasnull_base_probe.sha256
            build/userspace-probe/aliasnull_base_probe.provenance.txt
          if-no-files-found: error

      # ---- Part 27-T2: CI arm64 base-userspace digest component pipeline ----
      # Builds the AliasNull base-userspace SHA-256 file-digest component
      # (aliasnull_digest - the first genuinely reusable real base-userspace
      # component) as a real AArch64 ELF PIE standalone from the same NDK
      # 28.2.13676358 / CMake 3.22.1 toolchain the APK uses, validates it, hashes
      # it, records provenance, and uploads it. Like the probe, it is a normal
      # CMake executable target (never SHARED/JNI), is built only here standalone
      # (never by the AGP/APK native build), and is exercised on a device only
      # through the controlled Base Digest diagnostic. The SAME binary is the
      # committed asset app/src/main/assets/userspace/base/aliasnull_digest
      # (committed by the follow-up regeneration commit); the digest
      # reproducibility gate below recomputes its SHA-256, which must equal the
      # committed asset AND the BASE_DIGEST_SHA256 Kotlin manifest constant, so a
      # rebuild of the digest source is proven byte-identical to what ships.
      - name: Build AliasNull base userspace digest component (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          export PATH="${ANDROID_SDK_ROOT}/cmake/3.22.1/bin:${PATH}"
          cmake -S app/src/main/cpp \
                -B build/userspace-digest \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26
          cmake --build build/userspace-digest --target aliasnull_digest

      - name: Validate base userspace digest ELF / architecture
        run: |
          BIN="build/userspace-digest/aliasnull_digest"
          test -f "$BIN" || { echo "FAIL: digest executable was not produced"; exit 1; }
          test -s "$BIN" || { echo "FAIL: digest executable is empty"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ELF 64-bit" || { echo "FAIL: not a 64-bit ELF"; exit 1; }
          file "$BIN" | grep -q "ARM aarch64" || { echo "FAIL: not ARM AArch64"; exit 1; }
          file "$BIN" | grep -qE "pie executable|shared object" || { echo "FAIL: not an executable image"; exit 1; }
          readelf -h "$BIN" | grep -q "Machine:.*AArch64" || { echo "FAIL: readelf machine is not AArch64"; exit 1; }
          readelf -h "$BIN" | grep -q "Class:.*ELF64" || { echo "FAIL: readelf class is not ELF64"; exit 1; }
          echo "OK: validated as a 64-bit AArch64 ELF executable"

      - name: Compute SHA-256 of the base userspace digest component
        run: |
          BIN="build/userspace-digest/aliasnull_digest"
          sha256sum "$BIN" | tee build/userspace-digest/aliasnull_digest.sha256
          test -s build/userspace-digest/aliasnull_digest.sha256 || { echo "FAIL: SHA-256 not generated"; exit 1; }

      # ---- Part 27-T2 regeneration bootstrap (TEMPORARY - reverted by the follow-up commit) ----
      # The digest component is introduced by this commit but its committed asset
      # and manifest digest are not yet present, so the reproducibility gate below
      # will (correctly) fail until the freshly built bytes are committed as the
      # APK asset and the manifest constant is set from this run. To obtain exactly
      # those bytes, provenance generation and the digest-artifact upload run
      # BEFORE the gate in THIS commit only; the follow-up commit restores the
      # gate-first order and commits the regenerated asset and digest/provenance
      # so a fresh build then reproduces them.
      - name: Generate digest provenance metadata
        run: |
          BIN="build/userspace-digest/aliasnull_digest"
          SHA="$(awk '{print $1}' build/userspace-digest/aliasnull_digest.sha256)"
          SIZE="$(wc -c < "$BIN")"
          PROV="build/userspace-digest/aliasnull_digest.provenance.txt"
          {
            echo "component: aliasnull_digest"
            echo "executable_version: 1"
            echo "source_repository: AliasNull (aliasnull/AliasNullTerminal)"
            echo "source_revision: ${GITHUB_SHA}"
            echo "source_file: app/src/main/cpp/aliasnull_digest.cpp"
            echo "build_system: CMake + Android NDK android.toolchain.cmake"
            echo "toolchain_ndk: 28.2.13676358"
            echo "target_abi: arm64-v8a"
            echo "target_arch: AArch64 (64-bit)"
            echo "android_platform: 26"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "filename: aliasnull_digest"
            echo "file_size_bytes: ${SIZE}"
            echo "sha256: ${SHA}"
            echo "license: AliasNull project source terms (see repository LICENSE)"
          } > "$PROV"
          cat "$PROV"
          test -s "$PROV" || { echo "FAIL: digest provenance metadata not generated"; exit 1; }

      - name: Upload base userspace digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliasnull-base-userspace-digest
          path: |
            build/userspace-digest/aliasnull_digest
            build/userspace-digest/aliasnull_digest.sha256
            build/userspace-digest/aliasnull_digest.provenance.txt
          if-no-files-found: error

      # ---- Part 27-T2: the committed asset must be the reproducible binary ----
      # The standalone build above re-derives the digest component from the
      # CURRENT source tree. CI must prove that the committed APK asset
      # (app/src/main/assets/userspace/base/aliasnull_digest) is exactly what a
      # fresh build produces, and that the BASE_DIGEST_SHA256 manifest constant is
      # that same hash. Any mismatch (asset drifted from source, or the manifest
      # constant no longer describes the shipped binary) fails CI. Until the
      # follow-up regeneration commit lands, the committed asset is absent, so
      # this gate fails as intended (the digest component is not yet bundled).
      - name: Verify the committed digest asset reproduces the fresh build and matches the manifest constant
        run: |
          FRESH="build/userspace-digest/aliasnull_digest"
          COMMITTED="app/src/main/assets/userspace/base/aliasnull_digest"
          MANIFEST="app/src/main/java/app/aliasnull/shell/bootstrap/BaseUserspaceArtifact.kt"
          CONST="$(grep -A1 'BASE_DIGEST_SHA256' "$MANIFEST" | grep -oE '[0-9a-f]{64}' | head -n1)"
          test -n "$CONST" || { echo "FAIL: BASE_DIGEST_SHA256 constant not found in $MANIFEST"; exit 1; }
          test -f "$COMMITTED" || { echo "FAIL: committed asset $COMMITTED is missing (Part 27-T2); commit the CI-built digest component"; exit 1; }
          FRESH_SHA="$(sha256sum "$FRESH" | awk '{print $1}')"
          COMMITTED_SHA="$(sha256sum "$COMMITTED" | awk '{print $1}')"
          echo "fresh build:     $FRESH_SHA"
          echo "committed asset: $COMMITTED_SHA"
          echo "manifest const:  $CONST"
          test "$FRESH_SHA" = "$COMMITTED_SHA" \
            || { echo "FAIL: a fresh build of the digest component does not byte-match the committed asset (Part 27-T2)"; exit 1; }
          test "$FRESH_SHA" = "$CONST" \
            || { echo "FAIL: the digest hash does not match the BASE_DIGEST_SHA256 manifest constant (Part 27-T2)"; exit 1; }
          file "$COMMITTED"
          file "$COMMITTED" | grep -q "ELF 64-bit" || { echo "FAIL: committed digest asset is not a 64-bit ELF"; exit 1; }
          file "$COMMITTED" | grep -q "ARM aarch64" || { echo "FAIL: committed digest asset is not ARM AArch64"; exit 1; }
          readelf -h "$COMMITTED" | grep -q "Machine:.*AArch64" || { echo "FAIL: committed digest asset machine is not AArch64"; exit 1; }
          test -x "$COMMITTED" || { echo "FAIL: committed asset $COMMITTED is not stored as executable"; exit 1; }
          test -x "$FRESH" || { echo "FAIL: fresh build $FRESH is not executable"; exit 1; }
          echo "OK: committed base-userspace digest component reproduces the fresh build and matches the manifest constant"
          echo "note: stored-exec-bit asserted for packaging intent; Android runtime exec is verified only on a device"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AliasNull-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: AliasNull-Native-ARM64
          path: |
            app/build/intermediates/**/arm64-v8a/*.so
            app/build/intermediates/**/arm64-v8a/**/*.so
          if-no-files-found: warn
